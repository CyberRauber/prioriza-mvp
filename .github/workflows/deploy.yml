name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: prioriza-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar o site
        run: npm run build

      - name: Preparar landing como página inicial
        run: |
          cp -R landing/. dist/
          mkdir -p dist/landing
          cp -R landing/. dist/landing/
          cp index.html dist/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # A publicação automática por branch/Jekyll estava sobrescrevendo o app compilado.
      # Aguardar ela terminar e publicar depois garante que o artefato Vite seja o último deploy.
      - name: Aguardar o build automático do GitHub Pages
        run: sleep 120

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
